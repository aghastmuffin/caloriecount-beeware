name: Build on Release

on:
  push:
    tags:
      - 'v*'  # Only triggers when you push a tag like v1.0.0

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: Android
            os: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build ${{ matrix.platform }}
        id: build
        uses: aghastmuffin/beeware-builder@v0.1.2
        with:
          platform: ${{ matrix.platform }}
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.artifact-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
